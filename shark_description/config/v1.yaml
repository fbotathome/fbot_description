# Shark base geometry, version v1 (the base currently on BORIS).
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for base and wheel geometry.
# It is read by:
#   - urdf/shark_base.xacro               (links, joints, wheel positions)
#   - ros2_control/shark_base_ros2_control.xacro  (driver device, max velocity)
#   - fbot_bringup/launch/base.launch.py  (wheel_radius / wheel_separation of
#                                          the diff_drive_controller)
# Units: meters.
#
# wheel.radius and wheel.separation are the values odometry actually uses
# (previously set in boris_controllers.yaml). Re-measure and calibrate them
# when the hardware changes (see README: "Calibrating odometry").

base:
  length: 0.5
  width: 0.336
  height: 0.231

wheel:
  radius: 0.0775
  width: 0.06
  separation: 0.41      # distance between the two wheel centers
  x_offset: 0.0         # wheel axis position along base x (0 = base center)

caster_height: 0.07     # ground clearance of the underside of base_link

driver:
  device: /dev/ttySHARK
  max_velocity: 1.0     # m/s
