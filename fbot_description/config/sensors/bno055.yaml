# BNO055 IMU driver parameters (node name: bno055).
# frame_id MUST equal the IMU link in the URDF (imu_link), otherwise the EKF
# cannot transform the IMU data into base_footprint.
# uart_port is overridden by fbot_bringup/sensors.launch.py (arg imu_port);
# prefer a udev symlink (e.g. /dev/sensors/imu) over /dev/ttyUSBx.
bno055:
  ros__parameters:
    ros_topic_prefix: "bno055/"
    connection_type: "uart"
    uart_port: "/dev/ttyUSB2"
    uart_baudrate: 115200
    uart_timeout: 0.1
    data_query_frequency: 1000
    calib_status_frequency: 0.1
    frame_id: "imu_link"
    operation_mode: 0x0C
    placement_axis_remap: "P2"
    acc_factor: 100.0
    mag_factor: 16000000.0
    gyr_factor: 900.0
    grav_factor: 100.0
    set_offsets: false
    offset_acc: [0xFFEC, 0x00A5, 0xFFE8]
    offset_mag: [0xFFB4, 0xFE9E, 0x027D]
    offset_gyr: [0x0002, 0xFFFF, 0xFFFF]
